version: 2
title: Movie Genre Classification from Synopsis
image: logo.png
terms: pages/terms.md
description: Predict one dominant genre from a movie title and synopsis.
registration_auto_approve: True
make_programs_available: False
make_input_data_available: False
enable_detailed_results: False
show_detailed_results_in_submission_panel: True
show_detailed_results_in_leaderboard: False
contact_email: patelo11@mcmaster.ca
auto_run_submissions: True
can_participants_make_submissions_public: False
forum_enabled: True
pages:
  - title: Overview
    file: pages/overview.md
  - title: Data
    file: pages/data.md
  - title: Evaluation
    file: pages/evaluation.md
  - title: Submission
    file: pages/submission.md
  - title: Worker Setup
    file: pages/worker_setup.md
  - title: Terms
    file: pages/terms.md
phases:
  - index: 0
    name: Development
    description: Train on the public training split and score on the validation split.
    start: 2026-03-13 22:03:49
    end: 2026-06-13 22:03:49
    max_submissions_per_day: 5
    execution_time_limit: 1200
    hide_prediction_output: True
    starting_kit: starting_kit
    public_data: public_data
    accepts_only_result_submissions: False
    tasks:
      - 0
  - index: 1
    name: Final
    description: Final evaluation on the hidden test split.
    start: 2026-06-14 00:00:00
    end: 2026-07-13 22:03:49
    auto_migrate_to_this_phase: True
    execution_time_limit: 1200
    hide_prediction_output: True
    starting_kit: starting_kit
    public_data: public_data
    accepts_only_result_submissions: False
    tasks:
      - 1
tasks:
  - index: 0
    name: Development Task
    description: Validation-scored code submission task.
    input_data: tasks/development/input_data
    reference_data: tasks/development/reference_data
    ingestion_program: ingestion_program
    scoring_program: scoring_program
  - index: 1
    name: Final Task
    description: Test-scored code submission task.
    input_data: tasks/final/input_data
    reference_data: tasks/final/reference_data
    ingestion_program: ingestion_program
    scoring_program: scoring_program
solutions:
  - index: 0
    path: starting_kit
    tasks:
      - 0
      - 1
leaderboards:
  - title: Development Leaderboard
    key: development_public
    submission_rule: Force_Best
    columns:
      - title: Macro F1
        key: dev_public_macro_f1
        index: 0
        sorting: desc
        precision: 4
  - title: Final Leaderboard
    key: final_private
    submission_rule: Force_Best
    hidden: True
    columns:
      - title: Macro F1
        key: final_private_macro_f1
        index: 0
        sorting: desc
        precision: 4
